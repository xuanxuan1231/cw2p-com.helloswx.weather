[project]
name = "cw2p-com-helloswx-weather"
version = "1.0.0"
description = "天气小组件：实时天气、降水预报与天气预警，支持多个天气数据源。"
authors = [
    {name = "HelloSWX"},
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "class-widgets-sdk",
    "loguru>=0.7.3",
    "pypinyin>=0.55.0",
    "qt-lottie>=0.1.3",
    "rlottie_python",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qml*", "assets*", "weather*", "data*"]
