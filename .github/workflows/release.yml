name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: true
      version:
        description: 'Release version without the v prefix (for example: 1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="${REF_NAME#refs/tags/v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.0-9A-Za-z]+)?$ ]]; then
            echo "::error::Invalid release version: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Build plugin packages
        shell: bash
        run: |
          # Build .cwplugin format
          cw-plugin-pack
          # Build .zip format
          cw-plugin-pack --format zip

      - name: Publish to plugin registry
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        shell: bash
        env:
          CWPT_TOKEN: ${{ secrets.CWPT_TOKEN }}
        run: cw-plugin-publish

      - name: Create and push version tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "$TAG"

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog with git-cliff
        shell: bash
        run: |
          git-cliff --config .git-cliff.toml --tag "v${{ steps.version.outputs.version }}" --output CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            *.cwplugin
            *.zip
          body_path: CHANGELOG.md
          generate_release_notes: false
